<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Decision memo — Indizilla Research</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <meta name="theme-color" content="#FAFAF8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>(function(){var t;try{t=localStorage.getItem('theme')}catch(e){}if(t!=='light'&&t!=='dark'){t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==='dark'?'#14161A':'#FAFAF8';})();</script>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="brand" href="index.html" aria-label="Indizilla home">
      <img class="logo-light" src="assets/logo-mark-black.png" alt=""><img class="logo-dark" src="assets/logo-mark-white.png" alt="">
      INDIZILLA
    </a>
    <nav class="main-nav" id="main-nav" aria-label="Main">
      <a href="research.html" class="active">Research</a>
      <a href="research-new.html">New study</a>
      <a href="research-pricing.html">Credit packs</a>
      <a href="dashboard.html">Dashboard</a>
    </nav>
    <button class="theme-toggle" type="button" aria-label="Switch between light and dark mode"><svg class="tt-ico tt-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="tt-ico tt-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <div class="market-btn" title="Change market and currency"><span class="mb-sym">₹</span><select class="market-picker" aria-label="Choose your market"></select></div>
    <div class="header-cta">
      <span class="credit-pill" title="Study credits available"><span class="cp-label">Credits</span><span class="cp-amount" id="rc-balance">—</span></span>
    </div>
    <button class="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="main-nav">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
</header>

<main>
  <section class="section-tight">
    <div class="container container-narrow">

      <div id="report-state" class="report-state">Loading your memo…</div>

      <div id="report-body" hidden>
        <div class="report-top">
          <a class="link-hint" href="dashboard.html#research">← All studies</a>
          <a class="btn btn-secondary btn-sm" href="research-new.html">New study</a>
        </div>

        <article class="memo" id="memo"></article>
        <div class="decision-sections" id="decision-sections" hidden></div>

        <!-- Response breakdown -->
        <div class="card" style="margin-top:22px;">
          <h3 style="font-size:16px; margin-bottom:14px;">Response breakdown</h3>
          <div class="mix-bar" id="mix-bar"></div>
          <div class="mix-legend" id="mix-legend"></div>
          <div id="voices" class="voices"></div>
        </div>

        <!-- Survey used -->
        <details class="card survey-details" style="margin-top:18px;">
          <summary>The survey the panel answered</summary>
          <ol id="report-survey" class="survey-list-static"></ol>
        </details>

        <!-- Follow-up chat -->
        <div class="card" style="margin-top:18px;">
          <h3 style="font-size:16px; margin-bottom:6px;">Ask the panel</h3>
          <p class="hint" style="margin-bottom:14px;">Interrogate the results further. Each follow-up costs <strong>2 credits</strong>.</p>
          <div id="followups" class="followups"></div>
          <div class="ask-row">
            <input id="ask-input" type="text" placeholder="e.g. Why did the skeptics push back?" maxlength="240">
            <button class="btn btn-primary" type="button" id="ask-btn">Ask <span class="arrow">↗</span></button>
          </div>
          <p id="ask-msg" class="hint" style="margin-top:8px;" hidden></p>
        </div>
      </div>

    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/geo.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/research-engine.js"></script>
<script src="js/research-graph.js"></script>
<script src="js/research-clusters.js"></script>
<script src="js/research-evidence.js"></script>
<script src="js/research-strategist.js"></script>
<script src="js/research-views.js"></script>
<script src="js/research-conversation.js"></script>
<script src="js/research-decision.js"></script>
<script src="js/research-panel.js"></script>
<script src="js/research-live.js"></script>
<script src="js/research-db.js"></script>
<script src="js/main.js"></script>
<script src="js/metrics.js"></script>
<script src="js/research-report.js"></script>
</body>
</html>
